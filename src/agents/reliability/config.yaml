# Конфигурация агента надёжности (правило-основанный, без обучения).
#
# Размеченных отказов/закоксовывания в пакете нет (ТЗ п.3: «при отсутствии прямой
# разметки допускаются прокси-метрики с явным описанием допущений»), поэтому
# тяжесть режима считается по прокси-признакам. ВСЕ пороги ниже — модельные
# допущения для эксперимента, а не промышленные пределы (ТЗ п.4 «Правило границ»).
# Исторические статистики (медиана, робастный разброс) считаются по скользящей
# истории самого агента, а не берутся как «паспортные» значения.

# ---- теги -----------------------------------------------------------------------
# Смысл тегов — по справочнику КИП (Теги_хакатон.xlsx), а не по букве в имени:
#   W10 = Реактор Р-202, перепад давления (сигнал закоксовывания/забивки слоя)
#   T5  = Реактор Р-201, температура ГСС на выходе
#   P8  = Реактор Р-202, температура ГСС на входе (несмотря на букву P)
#   T11 = расход сырья на установку (массовый), F26 = то же (объёмный)
# Реальное имя колонки ищется по кандидатам tag, tag_hdt (см. suffixes): теги,
# которые есть только в 24-2000, в витрине идут без суффикса.
tags:
  dp: W10
  temperatures: [T5, P8]
  feed: [T11, F26]        # берётся первый найденный
suffixes: ["_hdt", ""]
names:
  W10: "Перепад давления Р-202"
  T5: "Температура ГСС на выходе Р-201"
  P8: "Температура ГСС на входе Р-202"
  T11: "Расход сырья"
  F26: "Расход сырья"

# ---- история ---------------------------------------------------------------------
history_points: 4320          # 30 суток при сетке 10 мин
min_history_points: 288       # меньше — оценку не выдаём (двое суток)
refresh_every: 144            # раз в сутки пересчитываем медианы/разброс
baseline_min_load_ratio: 0.5  # в базовую статистику идут только точки с нагрузкой >= 50% медианы
min_scale_rel: 0.003          # нижняя граница робастного разброса, доля от |медианы| (против ложных тревог на «плоских» тегах)
dp_min_scale_rel: 0.01        # то же для ΔP (он шумнее температур)

# ---- простой ---------------------------------------------------------------------
downtime_load_ratio: 0.10     # как в data_pipeline: расход < 10% медианы = простой

# ---- перепад давления (закоксовывание) ---------------------------------------------
dp_load_exponent: 1.5         # ДОПУЩЕНИЕ: ΔP ~ нагрузка^1.5; нормируем ΔP на нагрузку, чтобы рост расхода не давал ложный «рост ΔP»
dp_window_h: 24               # окно для тренда
dp_min_points: 12             # минимум точек в окне
dp_slope_crit_per_day: 0.05   # ДОПУЩЕНИЕ: рост нормированного ΔP на 5%/сутки = максимальная тревога

# ---- температуры / уровни: робастный z (upper-only) ---------------------------------
z_soft: 3.0                   # ниже — норма
z_hard: 6.0                   # выше — максимальная тревога

# ---- аномальность данных (как в data_pipeline: |robust z| > 5) ------------------------
anomaly_z: 5.0
anomaly_share_soft: 0.05
anomaly_share_hard: 0.15
exclude_exact: [block_id, is_valid, on_grid, anomaly_share, hours_since_block_start, is_startup,
                wabt, h2_to_feed, load_rel]
# Маркер «нет данных / обрыв канала»: у большинства КИП-тегов max в сырой выгрузке ровно 307.0
# (historical_stats.csv). Такие значения трактуются как пропуск, иначе они дают ложную аномальность.
sentinel_values: [307.0]
exclude_prefixes: ["mask_", "target_", "lims_"]   # плюс всё с ':' (ПАК) и '__' (служебные колонки)

# ---- перегрузка по сырью -------------------------------------------------------------
load_soft: 1.05               # ДОПУЩЕНИЕ: >105% от медианной загрузки — начало тревоги
load_hard: 1.25

# ---- свёртка в severity_index --------------------------------------------------------
weights: {dp: 0.40, temperature: 0.30, anomaly: 0.20, load: 0.10}
hard_floor_k: 0.90            # severity >= 0.9 * max(dp, temperature): один сильный физический сигнал не «размывается» остальными

# ---- классы ------------------------------------------------------------------------
warning_threshold: 0.40
critical_threshold: 0.80
critical_persistence: 3       # critical только если держится N циклов подряд (иначе warning) — оркестратор при critical эскалирует решение оператору

# ---- динамическая модель нормального поведения ΔP (обучаемая часть) --------------------
# Обучение: `make train_reliability`. Пока файла модели нет (или она не лучше наивного прогноза
# «ΔP не изменился», skill < min_skill), агент работает по упрощённому правилу — демо не ломается.
#
# Почему динамическая: по реальным данным уровень W10 «гуляет» в разы между неделями независимо
# от режима (скрытое состояние слоя), поэтому модель берёт ΔP лаг назад и предсказывает его
# изменение из-за изменения режима (см. nbm.py). Остаток «факт/модель - 1» = рост сопротивления,
# не объяснимый режимом (прокси закоксовывания). Время/возраст блока в признаки НЕ входит.
# Признаки — теги, определяющие ΔP слоя Р-202: нагрузка (T11/F26), температуры (T5, P8), давление
# на входе Р-202 (F19), квенч (F15), свежий ВСГ (P24), газ поддува (F9).
nbm:
  enabled: true
  model_path: data/converted/models/reliability_nbm.joblib
  target: W10
  features: [T11, F26, T5, P8, F19, F15, P24, F9]
  roll_points: 6                # сглаживание назад за 1 ч
  lag_points: 36                # лаг 6 ч: ΔП шесть часов назад = скрытое состояние
  ridge_alpha: 10.0
  startup_exclude_h: 15         # первые часы блока (пуск) в обучение не берём
  holdout_size: 120D            # как у агента качества: последние ~4 месяца по времени
  embargo: 1D
  val_frac: 0.15                # хвост train по времени под early stopping
  early_stopping_rounds: 50
  smooth_points: 144            # медиана остатка за 24 ч: скачок уровня живёт ровно лаг (6 ч) и не проходит, устойчивый рост — проходит
  prefill_points: 300           # сколько последних точек прогрева пересчитать через модель
  min_skill: 0.05               # модель обязана быть лучше наивного прогноза минимум на 5% по MAE
  min_rel_sigma: 0.01           # нижняя граница σ относительного остатка (против ложных тревог)
  params:
    n_estimators: 600
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 200
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 3
    verbosity: -1
    num_threads: -1
