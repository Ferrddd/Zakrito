# Конфигурация агента качества. Все управляемые теги (что "точно берем",
# что "возможно") — в config/controllable_tags.yaml, здесь только ссылка.
tags_catalog: markup/controllable_tags.yaml

# Монотонные ограничения для классификатора нарушения — только там, где
# физика понятна без P&ID.
monotone:
  - {installation: "242000", tag_id: T5,  direction: -1}   # выше темп. -> глубже очистка -> сера ниже
  - {installation: "242000", tag_id: P24, direction: -1}   # больше водорода -> сера ниже
  - {installation: "242000", tag_id: T11, direction: 1}    # выше загрузка -> сера выше
  - {installation: "242000", tag_id: F26, direction: 1}    # альтернатива T11, тот же знак

# W10 (перепад давления Р-202) и F25 (виртуальный анализатор вспышки) в
# отдельной секции не нуждаются — они не измеряют серу, поэтому идут в
# признаки на общих основаниях вместе со всей остальной телеметрией
# (см. features.raw_feature_candidates).

# Поточные анализаторы серы (КИП, не ПАК-выгрузка) — единственный настоящий
# чёрный список: это те же измерения серы, что и таргет, просто другим
# прибором. Запрещены в признаках при blind=True; при blind=False разрешены
# только с лагом >= горизонта прогноза.
sulfur_analyzer_tags:
  - {installation: "242000", tag_id: T6}
  - {installation: "242000", tag_id: W7}
  - {installation: "242000", tag_id: P13}

# ---- целевой показатель (из выгрузки ПАК, не из КИП) -----------------------
target:
  tag: "24-2000:Mg.Sulfur"
  unit: ppm
  limit: 10.0                        # ГОСТ/спецификация товарного ДТ, п.4 ТЗ

# ---- горизонты и признаки ---------------------------------------------------
horizons_points: [3, 6, 12]           # 30 / 60 / 120 минут при сетке 10 мин
grid_freq: 10min
lags_points: [3, 6, 12, 18]
window_points: [6, 18, 72]            # 1 / 3 / 12 часов

# ---- разбиение ---------------------------------------------------------------
holdout_size: 120D
cv_n_folds: 4
cv_fold_size: 60D
cv_expanding: true
embargo_safety: 1.5

# ---- модель ------------------------------------------------------------------
quantiles: [0.1, 0.5, 0.9]
violation_min_precision: 0.5

lgbm_params:
  n_estimators: 400
  learning_rate: 0.03
  num_leaves: 31
  min_child_samples: 500
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.5
  reg_lambda: 3
  verbosity: -1
  num_threads: -1
early_stopping_rounds: 50

# ---- артефакты ----------------------------------------------------------------
models_dir: data/converted/models
train_export: data/converted/train.parquet
test_export: data/converted/test.parquet
metrics_export: data/converted/models/metrics.json