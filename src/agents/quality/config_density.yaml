# Конфигурация модели плотности (D15). Отдельный файл, а не второй target в
# quality_agent.yaml: ПАК покрывает D15 только с 2025-03-05 (у серы — с
# 2023-01-01), поэтому у модели свой, урезанный период обучения и свой holdout —
# смешивать с сернистой моделью в одном train.py-прогоне нельзя, разъедет сплиты.

tags_catalog: config/controllable_tags.yaml

# Те же управляющие теги, что и у серы — глубина гидроочистки и границы
# отбора на АВТ влияют и на плотность тоже. Если для плотности физика знаков
# другая — не факт, что монотонность серы переносится один в один, проверить
# перед боевым использованием.
monotone:
  - {installation: "242000", tag_id: T5,  direction: 0}    # знак для плотности не установлен
  - {installation: "242000", tag_id: P24, direction: 0}
  - {installation: "242000", tag_id: T11, direction: 0}
  - {installation: "242000", tag_id: F26, direction: 0}

condition:
  - installation: "242000"
    tag_id: W10
    description: "Р-202, перепад давления — прокси закоксовывания"

# Анализаторы плотности пока не выделены в справочнике отдельно от серы —
# в отличие от T6/W7/P13, у нас нет отдельного КИП-тега "поточный анализатор
# плотности" на 24-2000, только сама колонка ПАК. Список пуст осознанно:
# если такой тег найдётся в справочнике, сюда его добавить по аналогии
# с sulfur_analyzer_tags.
density_analyzer_tags: []
virtual_analyzer_tags:
  - {installation: "242000", tag_id: F25}

# ---- целевой показатель ------------------------------------------------------
# ВАЖНО: плотность — двусторонний допуск (мин и макс), не как сера (только
# верхний предел). target_limit ниже — ПЛЕЙСХОЛДЕР по EN590 (820-845 кг/м3
# при 15°C), сверить с реальной спецификацией из ТЗ/выданных материалов.
# Текущий код (add_target/evaluate_violation) считает нарушение как
# value > limit — для одностороннего порога серы это верно, для плотности
# нужен двусторонний range-check. Без доработки этой логики target_violation
# для D15 будет считаться неправильно (заниженные нарушения — не поймает
# выход НИЖЕ min).
target:
  tag: "24-2000:D15"
  unit: "kg/m3"
  limit_min: 820.0                  # ПЛЕЙСХОЛДЕР — сверить с регламентом
  limit_max: 845.0                  # ПЛЕЙСХОЛДЕР — сверить с регламентом

# ---- покрытие данных ---------------------------------------------------------
# D15 в ПАК есть только с этой даты — данные раньше отбрасываются на этапе
# построения датасета, а не фильтруются пост-фактум внутри сплитов.
data_start: "2025-03-05"

# ---- горизонты и признаки ---------------------------------------------------
horizons_points: [3, 6, 12]
grid_freq: 10min
lags_points: [3, 6, 12, 18]
window_points: [6, 18, 72]

# ---- разбиение ---------------------------------------------------------------
# История короче (~17 месяцев вместо ~3.5 лет у серы) — меньше фолдов и
# короче holdout, иначе на expanding-CV первые фолды учатся почти в никуда.
holdout_size: 60D
cv_n_folds: 2
cv_fold_size: 30D
cv_expanding: true
embargo_safety: 1.5

# ---- модель ------------------------------------------------------------------
quantiles: [0.1, 0.5, 0.9]
violation_min_precision: 0.5

lgbm_params:
  n_estimators: 400
  learning_rate: 0.03
  num_leaves: 31                    # меньше листьев — данных заметно меньше, чем у серы
  min_child_samples: 100
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_lambda: 1.0
  verbosity: -1
early_stopping_rounds: 50

# ---- артефакты ----------------------------------------------------------------
models_dir: data/converted/models_density
train_export: data/converted/train_density.parquet
test_export: data/converted/test_density.parquet
metrics_export: data/converted/models_density/metrics.json