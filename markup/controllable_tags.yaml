# =============================================================================
# Справочник тегов установки 24-2000 (гидроочистка) и АВТ,
# используемых агентом качества.
#
# installation: "242000" (гидроочистка) — единственная установка, с которой
# сейчас работает агент качества. Появится AVT-тег — добавь installation: "avt".
# column_suffix — то, что merge(df_avt, df_hdt, suffixes=("_avt","_hdt")) в
# loader.py реально приклеивает к имени колонки.
# =============================================================================

installations:
  "242000":
    column_suffix: hdt
  avt:
    column_suffix: avt


# =============================================================================
# УСТАНОВКА 24-2000 (ГИДРООЧИСТКА)
# =============================================================================
installation:
  242000:

    # --- Точно берём (ядро агента качества) --------------------------------

    F9:
      description: "Расход сырья на установку, массовый"
      role: "нагрузка гидроочистки"
      units: "т/ч"
      required: true

    T16:
      description: "Блок стабилизации. Температура в сепараторе С-205"
      role: "режим стабилизации"
      units: "°C"
      required: true

    P24:
      description: "К-201. Давление на выходе колонны"
      role: "режим стабилизации"
      units: "МПа"
      required: true

    T12:
      description: "К-201. Температура верха колонны (бензин, УВГ, H2S)"
      role: "режим стабилизации"
      units: "°C"
      required: true

    T23:
      description: "К-201. Температура низа колонны, стабилизированный гидрогенизат"
      role: "режим стабилизации"
      units: "°C"
      required: true

    F14:
      description: "Полисеп. Расход квенча в реактор Р-202"
      role: "управление температурой реакции, защита катализатора"
      units: "т/ч"
      required: true

    # --- Возможно (включать по флагу) --------------------------------------

    T5:
      description: "Полисеп. Р-201. Температура ГСС на выходе"
      role: "режим реакции"
      units: "°C"
      required: false

    T6:
      description: "Полисеп. Р-202. Температура ГСС на входе"
      role: "температура входа в реактор"
      units: "°C"
      required: false

    T11:
      description: "Полисеп. Р-202. Температура ГСС / продукта на выходе"
      role: "выход реакции"
      units: "°C"
      required: false

    P8:
      description: "Реактор Р-202. Перепад давления"
      role: "косвенный индикатор закоксовывания катализатора"
      units: "МПа"
      required: false
      note: "P8 — просто показатель, не управляющее воздействие. Использовать только как признак риска."

    P13:
      description: "Полисеп. Р-202. Давление на входе"
      role: "режим реакции"
      units: "МПа"
      required: false

    F25:
      description: "Расход свежего ВСГ с КЦА на установку"
      role: "соотношение H2/сырьё, глубина обессеривания"
      units: "т/ч"
      required: false

    W7:
      description: "К-201. Расход газа поддува на входе, массовый"
      role: "соотношение H2/сырьё"
      units: "т/ч"
      required: false

    T18:
      description: "ВАК. Температура вспышки ГОДТ, аналитический показатель"
      role: "виртуальный анализ качества"
      units: "°C"
      required: false

    F17:
      description: "Расход гидроочищенного ДТ в цех №8, массовый"
      role: "выход ГОДТ"
      units: "т/ч"
      required: false

    F26:
      description: "Расход гидроочищенного ДТ в цех №8, объёмный"
      role: "выход ГОДТ"
      units: "м³/ч"
      required: false


# =============================================================================
# УСТАНОВКА АВТ
# =============================================================================
  avt:

    # --- Точно берём (ядро агента качества) --------------------------------

    T1:
      description: "Температура верха К-1 (выход на FIRC0955)"
      role: "профиль К-1"
      units: "°C"
      required: true

    P2:
      description: "Давление бензиновых паров верха К-1"
      role: "режим К-1"
      units: "МПа"
      required: true

    T6:
      description: "Температура низа К-1"
      role: "профиль К-1"
      units: "°C"
      required: true

    F12:
      description: "Расход 2-го ЦО в К-2"
      role: "профиль К-2"
      units: "т/ч"
      required: true

    F14:
      description: "Расход 1-го ЦО в К-2"
      role: "профиль К-2"
      units: "т/ч"
      required: true

    P22:
      description: "Давление верха К-2 (регистрирующее)"
      role: "режим К-2"
      units: "МПа"
      required: true

    F30:
      description: "Расход фр. 290–350 °C с установки"
      role: "выход дизельной фракции"
      units: "т/ч"
      required: true

    T33:
      description: "Температура низа К-2"
      role: "отбор дизельной фракции"
      units: "°C"
      required: true

    T37:
      description: "Температура ВЦО в К-10"
      role: "качество НЦО"
      units: "°C"
      required: true

    T49:
      description: "Температура верха К-10"
      role: "профиль К-10"
      units: "°C"
      required: true

    F64:
      description: "Расход 3-го ЦО в К-2"
      role: "профиль К-2"
      units: "т/ч"
      required: true

    F65:
      description: "Производительность К-2 по отбензиненной нефти"
      role: "нагрузка узла"
      units: "т/ч"
      required: true

    # --- Возможно (включать по флагу) --------------------------------------

    F7:
      description: "Расход обессоленной нефти (3-й ход) в Т-4/2"
      role: "нагрузка АВТ"
      units: "т/ч"
      required: false

    F8:
      description: "Расход обессоленной нефти (1-й ход) в Т-6/1"
      role: "нагрузка АВТ"
      units: "т/ч"
      required: false

    F9:
      description: "Расход обессоленной нефти (2-й ход) в Т-10/2"
      role: "нагрузка АВТ"
      units: "т/ч"
      required: false

    D10:
      description: "Плотность нефти на подаче"
      role: "прогноз выхода фракций"
      units: "кг/м³"
      required: false

    T20:
      description: "Температура верха К-2 (выход на FIRC0953)"
      role: "профиль К-2"
      units: "°C"
      required: false

    F5:
      description: "Расход пара в К-1"
      role: "отпаривание"
      units: "т/ч"
      required: false

    F29:
      description: "Расход пара в К-2"
      role: "отпаривание"
      units: "т/ч"
      required: false