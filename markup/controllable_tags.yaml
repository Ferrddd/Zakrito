# Справочник тегов установки 24-2000 (гидроочистка), используемых агентом
# качества.
#
# installation: "242000" (гидроочистка) — единственная установка, с которой
# сейчас работает агент качества. Появится AVT-тег — добавь installation: "avt".
# column_suffix — то, что merge(df_avt, df_hdt, suffixes=("_avt","_hdt")) в
# loader.py реально приклеивает к имени колонки.

installations:
  "242000":
    column_suffix: hdt
  avt:
    column_suffix: avt

installation:
  242000:
  #Точно берем
  T11:
    description: "Расход сырья на установку (массовый)"

  F14:
    description: "Блок стабилизации. Температура верха колонны К-201 /бензин,УВГ,Н2S"
  
  T16:
    description: "Блок стабилизации. Колонна К-201. Температура стабильного гидрогенизата низ"
  
  T18:
    description: "Блок стабилизации. Колонна К-201. Давление на выходе"

  P24:
